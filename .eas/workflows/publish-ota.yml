# Publish a production OTA update from EAS servers.
#
# This exists because neither of the other two routes works from the phone
# this project is maintained on:
#
#   eas update (Termux)  - @expo/metro-config throws "Unsupported host
#                          platform for Hermes compiler: android", because
#                          os.platform() is 'android' there and React Native
#                          ships hermesc only for x86_64 linux/mac/windows.
#                          No aarch64 build exists to install.
#   GitHub Actions       - runner allocation is blocked at the account level;
#                          runs fail in 1-3 seconds with zero steps.
#
# `eas workflow:run` uploads the project (or runs from --ref) and does the
# work on Expo's x86_64 infrastructure, where hermesc is the bundled binary
# and no GitHub minutes are involved.
#
# Run it with:
#   npm run publish:ota
#
# NOT with --ref. That would be the right answer - it runs from the pushed
# commit rather than the local tree - but it needs the Expo project linked
# to a GitHub repository, and this one is not:
#
#   [GraphQL] No repository found for appId 5f0bbeb3-e2d9-4a46-af9f-...
#
# So `workflow:run` uploads THE LOCAL DIRECTORY, and the local directory is
# what ships. That cost two published updates: the checkout sat at bcbe5d5
# while main had moved six merges ahead, so both publishes shipped code
# from before the fixes they were meant to deliver and the app looked
# unchanged.
#
# scripts/publish-ota.js therefore checks the tree before uploading it, and
# refuses unless HEAD is origin/main with nothing uncommitted. Linking the
# repository at expo.dev would make --ref work and retire that check.

name: Publish production OTA

jobs:
  publish_update:
    name: Publish Android OTA to the production channel
    type: update
    params:
      platform: android
      channel: production
