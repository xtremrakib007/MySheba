name: Publish MySheba OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Publish production OTA update"

jobs:
  update:
    name: Publish production OTA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN GitHub Actions secret is required."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Cheap, dependency-free guard: the script only reads source with
      # node's own fs, so it runs before npm ci and fails in seconds rather
      # than after a ten-minute build. Catches a tile or setScreen() that
      # points at a screen, tab or service which no longer exists - the
      # shape of bug the retired-module cleanup kept producing, and one that
      # neither lint nor a syntax check sees.
      - name: Audit navigation targets
        run: npm run audit:nav

      - name: Install dependencies
        run: npm ci

      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --message "$UPDATE_MESSAGE" \
            --non-interactive \
            --json | tee eas-update-result.json

      - name: Verify published Android update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('eas-update-result.json', 'utf8'));
          const expectedCommit = process.env.GITHUB_SHA;
          const updates = Array.isArray(data) ? data : (data.updates || []);
          if (!updates.length) {
            throw new Error('EAS CLI returned no published update records.');
          }
          const android = updates.find((u) => u.platform === 'android') || updates[0];
          const updateId = android.id || android.updateId;
          if (!updateId) {
            throw new Error('EAS CLI response did not contain an Android update ID.');
          }
          if (android.gitCommitHash && android.gitCommitHash !== expectedCommit) {
            throw new Error(`Published update commit ${android.gitCommitHash} does not match GitHub commit ${expectedCommit}.`);
          }
          console.log(`Published Android OTA update: ${updateId}`);
          console.log(`GitHub commit: ${expectedCommit}`);
          console.log(`Runtime: ${android.runtimeVersion || 'not reported'}`);
          NODE
