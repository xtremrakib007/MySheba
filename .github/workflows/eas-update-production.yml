name: Publish MySheba OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Publish production OTA update"

permissions:
  contents: read

jobs:
  update:
    name: Publish Android production OTA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN GitHub Actions secret is required."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit navigation targets
        run: npm run audit:nav

      - name: Audit context usage
        run: npm run audit:context

      - name: Audit JSX attribute escapes
        run: npm run audit:jsx

      - name: Check lockfiles are in sync
        run: node scripts/audit-lockfiles.js

      - name: Install dependencies
        run: npm ci

      - name: Publish Android production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'Publish production OTA update' }}
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --message "$UPDATE_MESSAGE" \
            --non-interactive \
            --json | tee eas-update-result.json

      - name: Verify published Android update
        run: |
          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('eas-update-result.json', 'utf8'));
          const expectedCommit = process.env.GITHUB_SHA;
          const updates = Array.isArray(data) ? data : (data.updates || []);

          if (!updates.length) {
            throw new Error('EAS CLI returned no published update records.');
          }

          const android = updates.find((u) => u.platform === 'android');
          if (!android) {
            throw new Error('EAS CLI response did not contain an Android update.');
          }

          const updateId = android.id || android.updateId;
          if (!updateId) {
            throw new Error('EAS CLI response did not contain an Android update ID.');
          }

          if (android.gitCommitHash && android.gitCommitHash !== expectedCommit) {
            throw new Error(
              `Published update commit ${android.gitCommitHash} does not match GitHub commit ${expectedCommit}.`
            );
          }

          console.log(`Published Android OTA update: ${updateId}`);
          console.log(`GitHub commit: ${expectedCommit}`);
          console.log(`Runtime: ${android.runtimeVersion || 'not reported'}`);
          NODE
