name: Publish MySheba OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Fix startup crash from obsolete chat references"

jobs:
  update:
    name: Publish production OTA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production OTA
        run: eas update --channel production --platform android --message "${{ inputs.message }}" --non-interactive
