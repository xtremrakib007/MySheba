name: Publish MySheba OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Fix startup crash from obsolete chat references"

jobs:
  update:
    name: Publish production OTA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --platform android --message "${{ inputs.message || github.event.head_commit.message }}" --non-interactive
