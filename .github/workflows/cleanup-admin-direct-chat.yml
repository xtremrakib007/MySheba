name: Cleanup Admin Direct Chat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove temporary Admin cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove retired Admin Direct Chat code
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/screens/AdminHomeScreen.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace("import * as directChatService from '../firebase/directChatService';\n", '')
          s = s.replace(', openDirectChat, marketplaceCategories', ', marketplaceCategories')
          s = re.sub(r'^  const \[messagingInquiryId, setMessagingInquiryId\] = useState\(null\);\n', '', s, flags=re.M)

          while True:
              m = re.search(r'^  const messageInquiry = async \(inq\) => \{', s, flags=re.M)
              if not m: break
              ob = s.find('{', m.start()); depth = 0; quote = None; esc = False
              for i in range(ob, len(s)):
                  c = s[i]
                  if quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                      continue
                  if c in "'\"`": quote = c; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          s = s[:m.start()] + s[i+1:]
                          break
              else:
                  raise SystemExit('Unbalanced messageInquiry function')

          marker = 'onPress={() => messageInquiry(inq)}'
          pos = s.find(marker)
          if pos >= 0:
              start = s.rfind('<TouchableOpacity', 0, pos)
              if start < 0: raise SystemExit('Cannot locate Message TouchableOpacity')
              depth = 0; i = start
              tag_re = re.compile(r'</?TouchableOpacity\b[^>]*>')
              while True:
                  mt = tag_re.search(s, i)
                  if not mt: raise SystemExit('Unbalanced TouchableOpacity around messageInquiry')
                  tag = mt.group(0)
                  if tag.startswith('</'):
                      depth -= 1
                      if depth == 0:
                          s = s[:start] + s[mt.end():]
                          break
                  elif not tag.rstrip().endswith('/>'):
                      depth += 1
                  i = mt.end()
          else:
              print('Message button already absent')

          s = re.sub(r'\n\s*disabled=\{messagingInquiryId === inq\.id\}', '', s)
          p.write_text(s, encoding='utf-8')

          forbidden = ('directChatService', 'openDirectChat', 'ensureDirectChat', 'messageInquiry', 'messagingInquiryId')
          if any(x in s for x in forbidden):
              raise SystemExit('Retired Admin Direct Chat reference remains: ' + ', '.join(x for x in forbidden if x in s))

      - name: Commit cleanup and remove this temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/AdminHomeScreen.js
          git commit -m 'refactor: remove retired Admin Direct Chat actions' || true
          git rm -f .github/workflows/cleanup-admin-direct-chat.yml
          git commit -m 'Remove temporary Admin cleanup workflow'
          git push
