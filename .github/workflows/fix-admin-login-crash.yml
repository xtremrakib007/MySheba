name: Fix admin login render crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix admin login render crash [patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin landing route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.js')
          s = p.read_text()
          old = "{renderedScreen === 'adminHome' && <AdminHomeScreen />}"
          new = "{renderedScreen === 'adminHome' && ((profile?.role === 'admin' || profile?.role === 'superadmin') && !adminViewingSection ? <AdminFeaturesScreen /> : <AdminHomeScreen />)}"
          if old not in s:
              raise SystemExit('adminHome render line not found')
          s = s.replace(old, new, 1)
          old_hook = "const { screen, authLoading, handleDeepLink } = useApp();"
          new_hook = "const { screen, authLoading, handleDeepLink, profile, adminViewingSection } = useApp();"
          if old_hook not in s:
              raise SystemExit('Root useApp line not found')
          s = s.replace(old_hook, new_hook, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-admin-login-crash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js .github/workflows/fix-admin-login-crash.yml
          git commit -m "fix admin login render crash [patched]"
          git push