name: _auth_repo_fix
on:
  push:
    paths:
      - '.repo-auth-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth registration cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/firebase/authService.js')
          s = p.read_text()
          s = s.replace('export async function registerCustomer({ name, phone, phoneE164, dialCode, email, pin, dealerCode, resellerCode, phoneIdToken }) {', 'export async function registerCustomer({ name, phone, phoneE164, dialCode, email, pin, phoneIdToken }) {')
          s = s.replace("  if (!dealerCode || !normalizePhone(dealerCode)) throw new Error('Please enter a dealer code.');\n", '')
          s = s.replace('  await registerFn({ name, phone, phoneE164, dialCode, email, pin, dealerCode, resellerCode, phoneIdToken });', '  await registerFn({ name, phone, phoneE164, dialCode, email, pin, phoneIdToken });')
          p.write_text(s)
          p = Path('src/context/AppContext.js')
          s = p.read_text()
          s = s.replace('authService.registerCustomer({ name, phone, phoneE164, dialCode, email, pin, dealerCode, resellerCode, phoneIdToken })', 'authService.registerCustomer({ name, phone, phoneE164, dialCode, email, pin, phoneIdToken })')
          p.write_text(s)
          Path('.repo-auth-fix-trigger').unlink(missing_ok=True)
          Path('.github/workflows/_auth_repo_fix.yml').unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix customer registration auth flow"
          git push
