name: Publish Production OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "EAS Update message"
        required: true
        default: "Fix Android startup navigation state"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || {
            echo "::error::EXPO_TOKEN GitHub Actions secret is not configured."
            exit 1
          }

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: audit-fix-all-2026-09-16

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify production source
        run: |
          npm run production:check
          npm run test:api-provider
          npm run audit:functions

      - name: Publish Android production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update             --channel production             --platform android             --message "${{ inputs.message }}"             --non-interactive
