name: Restore and clean AppContext
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'refactor: restore and clean AppContext'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source
        run: git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > /tmp/AppContext.js
      - name: Clean retired chat code
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('/tmp/AppContext.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'^import \* as (?:directChatService|groupChatService|roomChatService|chatLockService) from .*\n','',s,flags=re.M)
          def state(t,n): return re.sub(r'^  const \['+re.escape(n)+r'[^\n]*\n','',t,flags=re.M)
          for n in ('activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText','activeInvestigateChatId','activeInvestigateReport','lockedChatIds','chatVaultUnlocked','activeGroupId','activeGroupName','myGroups','groupUnreadCount','activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab','incomingGroupCall'): s=state(s,n)
          def callback(t,n):
            m=re.search(r'^  const '+re.escape(n)+r'\s*=\s*useCallback\b',t,re.M)
            if not m:return t
            ob=t.find('{',m.start()); d=0; q=None; e=False
            for i in range(ob,len(t)):
              c=t[i]
              if q:
                if e:e=False
                elif c=='\\':e=True
                elif c==q:q=None
              elif c in "'\"`":q=c
              elif c=='{':d+=1
              elif c=='}':
                d-=1
                if d==0:
                  j=i+1
                  while j<len(t) and t[j] in ' ;\t\r\n':j+=1
                  return t[:m.start()]+t[j:]
            raise SystemExit('unbalanced '+n)
          for n in ('openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','openInvestigateChat'):
            while re.search(r'^  const '+re.escape(n)+r'\s*=\s*useCallback\b',s,re.M):s=callback(s,n)
          retired=re.compile(r'\b(activeDirectChatId|activeDirectChatName|activeDirectChatUid|directChatUnreadCount|openDirectChat|activeInvestigateChatId|activeInvestigateReport|openInvestigateChat|chatDraftText|activeGroupId|activeGroupName|myGroups|groupUnreadCount|openGroupChat|activeRoomId|activeRoomName|myRooms|discoverableRooms|openRoomChat|chatHubTab|openChatHub|incomingGroupCall|startGroupCall|answerIncomingGroupCall|rejectIncomingGroupCall|investigateChat)\b')
          s=''.join(x for x in s.splitlines(True) if not retired.search(x))
          for n in ('chatHub','directChatList','addContact','qrScan','myQrCode','groupList','newGroup','createRoom','roomSettings','investigateChat'):
            s=re.sub(r'\s*\|\s*'+re.escape(n)+r'(?=\s*\||\s*$)','',s,flags=re.M)
          if any(x in s for x in ('directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat')): raise SystemExit('retired references remain')
          for x in ('activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService'):
            if x not in s: raise SystemExit('required missing: '+x)
          if len(s)<20000: raise SystemExit('unexpectedly short: '+str(len(s)))
          p=Path('src/context/AppContext.js');p.write_text(s,encoding='utf-8')
          print('clean AppContext bytes',len(s))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git commit -m 'refactor: restore and clean AppContext'
          git push
