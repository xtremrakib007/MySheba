name: Remove retired Marketplace Social modules
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dedicated retired files and app/admin references
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          needles=['marketplace','social','community','accommodation','roommate','serviceprovider','listing','property']
          for base in ['src/screens','src/firebase','src/components','src/utils','admin-web/src/pages','admin-web/src/services']:
            d=Path(base)
            if not d.exists(): continue
            for p in list(d.rglob('*')):
              if p.is_file() and any(x in p.name.lower() for x in needles): p.unlink()
          targets=[Path('App.js'),Path('src/components/Sidebar.js'),Path('src/components/BottomNav.js'),Path('admin-web/src/App.tsx')]
          for p in targets:
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'^\s*import .*?(?:Marketplace|marketplace|Social|social|Community|community|Accommodation|accommodation|Roommate|roommate|ServiceProvider|serviceProvider).*?;\s*$', '', s, flags=re.M)
            s=re.sub(r'^.*(?:Marketplace|marketplace|Social|social|Community|community|Accommodation|accommodation|Roommate|roommate|ServiceProvider|serviceProvider|roomSharing|servicesHome|marketplaceHome|socialFeed|createSocialPost|socialPostDetail).*$\n?', '', s, flags=re.M)
            p.write_text(s,encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove retired Marketplace and Social modules [skip ci]' || true
          git push origin HEAD:main
