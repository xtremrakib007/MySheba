name: Repair AppContext retired navigation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good AppContext baseline
        run: git checkout 670aabd3e465ad3f848aa86aa6ea2d4ea8a179ee -- src/context/AppContext.js
      - name: Remove retired navigation blocks safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/context/AppContext.js')
          s = p.read_text()
          start = s.index('  // ---- marketplace (Buy & Sell) ----')
          end = s.index('  // ---- My Documents (private per-user document vault')
          s = s[:start] + s[end:]
          p.write_text(s)
      - name: Verify JavaScript syntax
        run: node --check src/context/AppContext.js
      - name: Commit repaired file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'fix: remove retired marketplace property social navigation from AppContext [skip ci]'
          git push
