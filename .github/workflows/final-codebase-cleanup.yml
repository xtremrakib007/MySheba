name: Final codebase cleanup

on:
  push:
    paths:
      - .github/workflows/final-codebase-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired chat moderation and temporary files
        shell: python
        run: |
          from pathlib import Path
          import re

          # Retired admin Direct Chat moderation pages/services.
          for p in [
              'admin-web/src/pages/ChatReportsPage.tsx',
              'admin-web/src/pages/InvestigateChatPage.tsx',
              'admin-web/src/services/investigationService.ts',
          ]:
              path = Path(p)
              if path.exists():
                  path.unlink()

          # Retired backup/trigger artifacts.
          for p in [
              'src/components/AnimatedSplash.backup.js',
              '.appcontext-cleanup-trigger',
              '.cleanup-appcontext-now',
              '.restore-appcontext-trigger',
          ]:
              path = Path(p)
              if path.exists():
                  path.unlink()

          # Remove retired chat routes/imports from Admin Web.
          p = Path('admin-web/src/App.tsx')
          s = p.read_text()
          s = s.replace("import ChatReportsPage from './pages/ChatReportsPage';\n", '')
          s = s.replace("import InvestigateChatPage from './pages/InvestigateChatPage';\n", '')
          s = s.replace('<Route path="/chat-reports" element={<ChatReportsPage/>}/>','')
          s = s.replace('<Route path="/chat-reports/investigate/:chatId" element={<InvestigateChatPage/>}/>','')
          p.write_text(s)

          # Remove retired chat menu entries from the native app sidebar.
          p = Path('src/components/Sidebar.js')
          s = p.read_text()
          s = s.replace("    { key: 'chatReports', icon: '🚨', label: 'Chat Reports' },\n", '')
          s = s.replace("    { key: 'investigateChat', icon: '🔎', label: 'Investigate Chat' },\n", '')
          p.write_text(s)

          # Strip retired Direct Chat moderation section from the shared
          # admin moderation service while preserving KYC + marketplace moderation.
          p = Path('admin-web/src/services/moderationService.ts')
          s = p.read_text()
          s = s.replace('  limitToLast as fbLimitToLast,\n', '')
          s = s.replace('  onSnapshot,\n', '')
          marker = '\n// ---------------------------------------------------------------------\n// Chat Reports — real collection: directChatReports/{id}'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(s)

          # Remove the retired Direct Chat report metric from admin reports.
          p = Path('admin-web/src/services/reportsService.ts')
          s = p.read_text()
          s = s.replace('  pendingChatReports: number | null;\n', '')
          s = s.replace('    pendingChatReports,\n', '')
          s = s.replace("    count('directChatReports', 'status', 'open'),\n", '')
          s = s.replace('    pendingChatReports,\n', '')
          p.write_text(s)

          # Remove stale direct-chat references from the admin index files.
          for name in ['admin-web/firestore.indexes.json', 'firestore.indexes.json']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              # Remove index objects whose collectionGroup is directChatReports.
              s = re.sub(r'\s*\{\s*"collectionGroup"\s*:\s*"directChatReports".*?\n\s*\}', '', s, flags=re.S)
              p.write_text(s)

      - name: Verify retired chat code is gone from active source
        run: |
          ! grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='package-lock.json' \
            -E 'directChatReports|directChatService|groupChatService|roomChatService|startGroupCall|openDirectChat|ensureDirectChat|ChatReportsPage|InvestigateChatPage' \
            src admin-web/src || true

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'chore: remove retired chat code and cleanup artifacts'
          git push

      - name: Remove this one-time workflow
        run: |
          git rm .github/workflows/final-codebase-cleanup.yml
          git commit -m 'chore: remove one-time cleanup workflow'
          git push
