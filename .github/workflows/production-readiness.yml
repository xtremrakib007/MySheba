name: Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify source, rules and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Security regression tests
        run: npm run test:security

      - name: Production readiness gate
        run: npm run production:check

      # Expo SDK 53 pins parts of the Metro/Expo build toolchain that npm audit
      # currently reports as high severity. npm audit --force would upgrade Expo
      # / React Native across major versions and can break the SDK 53 app.
      # Keep the audit visible as a warning, but do not block the source/rules
      # production gate on build-tooling-only advisories.
      - name: Dependency audit (non-blocking build-tooling advisories)
        run: |
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::npm audit reported advisories in the Expo/Metro dependency tree; major upgrades were not applied automatically because this app is pinned to Expo SDK 53."
          }

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Functions dependency audit
        working-directory: functions
        run: npm audit --audit-level=high

  production-build:
    name: Android production AAB
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production AAB
        run: npx eas-cli build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
