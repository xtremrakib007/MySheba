name: Publish EAS Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production source
        run: npm run production:check
      - name: Validate Cloud Functions syntax
        run: npm run audit:functions
      - name: Publish Android EAS Update
        run: npx eas-cli update --environment production --channel production --platform android --message "Automated Android production update"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
