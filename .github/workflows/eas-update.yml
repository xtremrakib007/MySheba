name: Publish EAS Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Publish Android EAS Update
        run: npx eas-cli update --channel production --platform android --message "Automated Android update"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
