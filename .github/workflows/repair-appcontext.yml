name: Restore known-good AppContext
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore AppContext
        run: |
          set -euo pipefail
          git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > src/context/AppContext.js
          git diff --check
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'fix: restore AppContext before chat cleanup'
          git push
