name: Repair AppContext safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'refactor: clean retired chat state from AppContext'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore and clean AppContext
        shell: bash
        run: |
          set -euo pipefail
          git checkout c875464673f0e87ef84f66c7e198a394e80d266f -- src/context/AppContext.js
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/context/AppContext.js')
          s = p.read_text(encoding='utf-8')

          imports = [
              "import * as directChatService from '../firebase/directChatService';",
              "import * as groupChatService from '../firebase/groupChatService';",
              "import * as roomChatService from '../firebase/roomChatService';",
              "import * as chatLockService from '../firebase/chatLockService';",
          ]
          s = '\n'.join(line for line in s.splitlines() if line.strip() not in imports) + '\n'

          route_tokens = [
              'chatHub | ', 'directChatList | ', 'addContact | ', 'qrScan | ',
              'myQrCode | ', 'groupList | ', 'newGroup | ', 'createRoom | ',
              'roomSettings | ', 'investigateChat | '
          ]
          for token in route_tokens:
              s = s.replace(token, '')

          state_names = [
              'activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText',
              'activeInvestigateChatId','activeInvestigateReport',
              'activeGroupId','activeGroupName','myGroups','groupUnreadCount',
              'activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab',
              'lockedChatIds','chatVaultUnlocked','incomingGroupCall'
          ]
          lines = s.splitlines(True)
          s = ''.join(line for line in lines if not any(('const [' + n) in line for n in state_names))

          def remove_callback(text, name):
              marker = 'const ' + name + ' = useCallback'
              start = text.find(marker)
              if start < 0:
                  return text
              start = text.rfind('  ', 0, start)
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit('callback body missing: ' + name)
              depth = 0
              quote = None
              escaped = False
              end = None
              for i in range(brace, len(text)):
                  c = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in "'\"`":
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' ;\t\r\n':
                              end += 1
                          return text[:start] + text[end:]
              raise SystemExit('unbalanced callback: ' + name)

          for name in ['openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','openInvestigateChat']:
              while 'const ' + name + ' = useCallback' in s:
                  s = remove_callback(s, name)

          retired_services = ['directChatService','groupChatService','roomChatService','subscribeIncomingGroupCalls','chatLockService']
          while True:
              marker = '  useEffect(() => {'
              start = s.find(marker)
              removed = False
              while start >= 0:
                  brace = s.find('{', start)
                  depth = 0
                  quote = None
                  escaped = False
                  close = None
                  for i in range(brace, len(s)):
                      c = s[i]
                      if quote:
                          if escaped:
                              escaped = False
                          elif c == '\\':
                              escaped = True
                          elif c == quote:
                              quote = None
                          continue
                      if c in "'\"`":
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              close = i
                              break
                  if close is None:
                      break
                  end = s.find(');', close)
                  if end < 0:
                      break
                  block = s[start:end+2]
                  if any(x in block for x in retired_services):
                      s = s[:start] + s[end+2:]
                      removed = True
                      break
                  start = s.find(marker, end+2)
              if not removed:
                  break

          for header in ['  // ---- direct chat (general-purpose', '  // ---- direct chat investigation']:
              start = s.find(header)
              if start >= 0:
                  end = s.find('  // ---- marketplace', start)
                  if end >= 0:
                      s = s[:start] + s[end:]

          retired = [
              'activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount',
              'openDirectChat','activeInvestigateChatId','activeInvestigateReport','openInvestigateChat',
              'chatDraftText','activeGroupId','activeGroupName','myGroups','groupUnreadCount','openGroupChat',
              'activeRoomId','activeRoomName','myRooms','discoverableRooms','openRoomChat','chatHubTab',
              'openChatHub','incomingGroupCall','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall',
              'investigateChat'
          ]
          s = ''.join(line for line in s.splitlines(True) if not any(x in line for x in retired))

          required = ['activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('required Support/1-to-1 calling code missing: ' + ', '.join(missing))

          forbidden = ['directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat']
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('retired AppContext refs remain: ' + ', '.join(bad))

          p.write_text(s, encoding='utf-8')
          print('AppContext cleanup validation passed')
          PY

      - name: Commit verified AppContext
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'refactor: clean retired chat state from AppContext'
          git push
