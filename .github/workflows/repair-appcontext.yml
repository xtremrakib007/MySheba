name: Repair AppContext navigation state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing screen state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/AppContext.js')
          s = p.read_text()
          marker = '  // signed in, the account\'s Firestore `role` field (in `profile.role`)\n  // decides which home screen to land on. See the bootstrap effect below.\n'
          line = '  const [screen, setScreen] = useState("login");\n'
          if line not in s:
              if marker not in s:
                  raise SystemExit('navigation marker not found; refusing unsafe edit')
              s = s.replace(marker, marker + line + '\n', 1)
              p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore AppContext screen state [skip ci]'
          git push
