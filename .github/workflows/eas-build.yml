name: Build MySheba Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Production Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate production source
        run: npm run production:check

      - name: Validate Cloud Functions syntax
        run: npm run audit:functions

      - name: Run API provider regression tests
        run: npm run test:api-provider

      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --wait --message "MySheba production AAB"

      - name: Download AAB
        run: eas build:download --platform android --non-interactive

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysheba-production-aab
          path: "*.aab"
          if-no-files-found: error
