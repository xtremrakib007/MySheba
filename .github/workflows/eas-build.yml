name: Build MySheba Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Production Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # eas-cli needs >=22: @oclif/plugin-autocomplete refuses to install on 20
          cache: npm

      # package.json and package-lock.json drifting apart is what `npm ci` below
      # refuses on, and it refuses only after the runner has finished setting
      # itself up. This script uses nothing but Node builtins, so it can say so
      # in the first few seconds instead.
      - name: Check lockfiles are in sync
        run: node scripts/audit-lockfiles.js

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify EAS production environment
        shell: bash
        run: |
          set +e -uo pipefail

          # A bad or expired EXPO_TOKEN surfaces here. `eas env:list` only ever
          # says "env:list command failed", which does not distinguish an auth
          # problem from a missing variable.
          echo "--- eas whoami ---"
          eas whoami || echo "eas whoami failed: EXPO_TOKEN may be invalid, expired, or lack access to the project."
          echo "--- eas-cli version ---"
          eas --version || true

          # This step is a pre-flight: it exists to save a ~30 minute build when
          # GOOGLE_SERVICES_JSON is missing from the production environment.
          # `--non-interactive` is not accepted by every eas-cli version and
          # eas-version is `latest` here, so try it and fall back without it.
          echo "--- eas env:list ---"
          vars="$(EXPO_DEBUG=1 eas env:list --environment production --non-interactive 2>&1)"
          status=$?
          if [ $status -ne 0 ]; then
            vars="$(EXPO_DEBUG=1 eas env:list --environment production 2>&1)"
            status=$?
          fi

          if [ $status -ne 0 ]; then
            # The probe could not run. Say so loudly, but do not block the build:
            # `eas build` validates file-type environment variables itself, so a
            # broken pre-flight must not be the thing that stops a release.
            echo "$vars"
            echo "::warning::Could not list the EAS production environment; skipping the GOOGLE_SERVICES_JSON pre-flight. The build itself still validates it."
          elif grep -q GOOGLE_SERVICES_JSON <<<"$vars"; then
            echo "GOOGLE_SERVICES_JSON is present in the production environment."
          else
            echo "$vars"
            echo "::error::Missing EAS production file variable: GOOGLE_SERVICES_JSON"
            exit 1
          fi

      - name: Validate production source
        run: npm run production:check

      - name: Validate Cloud Functions syntax
        run: npm run audit:functions

      # Doubled escapes have shipped four times: a PIN regex that validated
      # nothing, a search sentinel that excluded most names, a recovery hash
      # that never matched, and secret redaction that never fired.
      - name: Doubled-escape audit
        run: npm run audit:escapes

      # scripts/test-api-provider-service.js requires functions/apiProviderService.js,
      # which requires firebase-functions/v2/https - a dependency of functions/,
      # not of the root package. The root `npm ci` above does not install it, so
      # this gate failed with MODULE_NOT_FOUND on every run that got far enough
      # to reach it, and would have blocked the build rather than the build
      # being blocked by anything it actually tests.
      - name: Install function dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Run API provider regression tests
        run: npm run test:api-provider

      # The Success TopUp operator map silently covered three of eight codes,
      # so half the Bangladesh operator picker charged the wallet and was then
      # rejected by the provider. Nothing else catches that.
      - name: Success TopUp contract
        run: npm run test:successtopup

      - name: App Check posture
        run: npm run test:appcheck

      # Both trees are installed by this point, so the gate can audit each one.
      - name: Audit production dependencies
        run: npm run audit:deps

      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --wait --message "MySheba production AAB"

      - name: Download AAB
        run: eas build:download --platform android --non-interactive

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysheba-production-aab
          path: "*.aab"
          if-no-files-found: error
