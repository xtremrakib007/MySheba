name: Final retired chat cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: remove final chat cleanup trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean AppContext
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/context/AppContext.js')
          s = p.read_text(encoding='utf-8')

          retired_imports = ('directChatService', 'groupChatService', 'roomChatService', 'chatLockService')
          s = ''.join(line for line in s.splitlines(True) if not any(
              line.startswith('import * as ' + x + ' ') for x in retired_imports
          ))

          # Remove direct-chat/investigation state without touching ringtone state.
          names = {
              'activeDirectChatId','activeDirectChatName','activeDirectChatUid',
              'directChatUnreadCount','chatDraftText','activeInvestigateChatId',
              'activeInvestigateReport','lockedChatIds','chatVaultUnlocked',
              'activeGroupId','activeGroupName','myGroups','groupUnreadCount',
              'activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab',
              'incomingGroupCall'
          }
          s = ''.join(line for line in s.splitlines(True) if not any(re.search(r'\\b'+re.escape(n)+r'\\b', line) for n in names))

          # Remove the read-only direct-chat investigation callback.
          s = re.sub(r'^  const openInvestigateChat = useCallback\\(.*?^  \\}, \\[\\]\\);\\n', '', s, flags=re.M|re.S)

          # Remove callbacks by balanced-brace scan.
          def remove_callback(text, name):
              m = re.search(r'^  const ' + re.escape(name) + r'\\s*=\\s*useCallback\\b', text, flags=re.M)
              if not m: return text
              ob = text.find('{', m.start())
              depth = 0; quote = None; esc = False
              for i in range(ob, len(text)):
                  c = text[i]
                  if quote:
                      if esc: esc = False
                      elif c == '\\\\': esc = True
                      elif c == quote: quote = None
                      continue
                  if c in "'\\\"`": quote = c; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          j = i + 1
                          while j < len(text) and text[j] in ' ;\\t\\r\\n': j += 1
                          return text[:m.start()] + text[j:]
              raise SystemExit('Unbalanced callback: ' + name)

          for name in ('openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','openInvestigateChat'):
              while re.search(r'^  const ' + re.escape(name) + r'\\s*=\\s*useCallback\\b', s, flags=re.M):
                  s = remove_callback(s, name)

          # Remove effects that exist only for retired chat services/listeners.
          while True:
              found = False
              for m in list(re.finditer(r'^  useEffect\\(\\(\\) => \\{', s, flags=re.M)):
                  ob = s.find('{', m.start()); depth = 0; quote = None; esc = False; close = None
                  for i in range(ob, len(s)):
                      c = s[i]
                      if quote:
                          if esc: esc = False
                          elif c == '\\\\': esc = True
                          elif c == quote: quote = None
                          continue
                      if c in "'\\\"`": quote = c; continue
                      if c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: close = i; break
                  if close is None: continue
                  end = s.find(');', close)
                  if end < 0: continue
                  block = s[m.start():end+2]
                  if any(x in block for x in ('directChatService','groupChatService','roomChatService','subscribeIncomingGroupCalls','chatLockService')):
                      s = s[:m.start()] + s[end+2:]
                      found = True
                      break
              if not found: break

          # Remove retired names from the exported context value and comments.
          exported = re.compile(r'\\b(activeDirectChatId|activeDirectChatName|activeDirectChatUid|directChatUnreadCount|openDirectChat|activeInvestigateChatId|activeInvestigateReport|openInvestigateChat|chatDraftText|activeGroupId|activeGroupName|myGroups|groupUnreadCount|openGroupChat|activeRoomId|activeRoomName|myRooms|discoverableRooms|openRoomChat|chatHubTab|openChatHub|incomingGroupCall|startGroupCall|answerIncomingGroupCall|rejectIncomingGroupCall|investigateChat)\\b')
          s = ''.join(line for line in s.splitlines(True) if not exported.search(line))
          s = s.replace(' | chatHub | directChatList | addContact | qrScan | myQrCode | groupList | newGroup | createRoom | roomSettings', '')
          s = s.replace(' | investigateChat', '')

          required = ('activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService')
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit('Required Support/1:1 calling state missing: ' + ', '.join(missing))

          forbidden = ('directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat')
          bad = [x for x in forbidden if x in s]
          if bad: raise SystemExit('Retired AppContext refs remain: ' + ', '.join(bad))
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -e
          test -f src/context/AppContext.js
          ! grep -nE 'directChatService|groupChatService|roomChatService|chatLockService|openDirectChat|openGroupChat|openRoomChat|openChatHub|startGroupCall|subscribeIncomingGroupCalls|incomingGroupCall|activeDirectChat|activeGroupId|activeRoomId|myGroups|myRooms|chatHubTab|investigateChat' src/context/AppContext.js
          grep -nE 'activeChatId|activeRingtoneContactUid|activeRingtoneContactName|activeCall|incomingCall|callService' src/context/AppContext.js >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git commit -m 'refactor: remove retired chat state from AppContext'
          git rm -f .cleanup-trigger .github/workflows/final-chat-cleanup.yml
          git commit -m 'chore: remove final chat cleanup trigger'
          git push
