name: Final chat cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove retired chat UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove retired chat dependencies
        shell: python
        run: |
          from pathlib import Path

          ROOT = Path('.')

          def remove_named_assignment(text, name):
              needle = 'const ' + name + ' ='
              start = 0
              while True:
                  i = text.find(needle, start)
                  if i < 0:
                      return text
                  # Don't touch property names such as "const foo =" inside a string/comment.
                  if i > 0 and text[i-1].isalnum():
                      start = i + len(needle); continue
                  j = i + len(needle)
                  depth = {'{':0,'(':0,'[':0}
                  quote = None
                  escape = False
                  template = False
                  while j < len(text):
                      c = text[j]
                      if quote:
                          if escape: escape = False
                          elif c == '\\': escape = True
                          elif c == quote: quote = None
                      else:
                          if c in "'\"`": quote = c
                          elif c == '{': depth['{'] += 1
                          elif c == '}': depth['{'] -= 1
                          elif c == '(': depth['('] += 1
                          elif c == ')': depth['('] -= 1
                          elif c == '[': depth['['] += 1
                          elif c == ']': depth['['] -= 1
                          elif c == ';' and all(v == 0 for v in depth.values()):
                              return text[:i] + text[j+1:]
                      j += 1
                  return text

          def remove_useeffect_containing(text, markers):
              pos = 0
              while True:
                  i = text.find('useEffect(() =>', pos)
                  if i < 0: return text
                  # Find matching closing ')' of useEffect call, respecting strings/brackets.
                  j = i + len('useEffect(')
                  depth = 1
                  quote = None
                  escape = False
                  while j < len(text) and depth:
                      c = text[j]
                      if quote:
                          if escape: escape = False
                          elif c == '\\': escape = True
                          elif c == quote: quote = None
                      else:
                          if c in "'\"`": quote = c
                          elif c == '(' : depth += 1
                          elif c == ')' : depth -= 1
                      j += 1
                  block = text[i:j]
                  if any(m in block for m in markers):
                      text = text[:i] + text[j:]
                      pos = max(0, i-1)
                  else:
                      pos = j

          def remove_lines_containing(text, needles):
              return '\n'.join(line for line in text.split('\n') if not any(n in line for n in needles))

          # AppContext: remove Direct/Group/Room Chat state, listeners and openers.
          p = ROOT/'src/context/AppContext.js'
          s = p.read_text()
          s = remove_lines_containing(s, [
              "import * as directChatService from '../firebase/directChatService';",
              "import * as groupChatService from '../firebase/groupChatService';",
              "import * as roomChatService from '../firebase/roomChatService';",
          ])
          for name in [
              'openDirectChat','openGroupChat','openRoomChat','openChatHub','openLockedChats',
          ]:
              s = remove_named_assignment(s, name)
          s = remove_useeffect_containing(s, ['directChatService.', 'groupChatService.', 'roomChatService.'])
          for name in ['activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText','activeInvestigateChatId','activeInvestigateReport']:
              s = remove_named_assignment(s, name)
          # Remove direct/group/room-specific navigation values from the screen comment/string.
          for token in ['chatList','chatHub','directChatList','addContact','qrScan','myQrCode','groupList','newGroup','createRoom','roomSettings','investigateChat']:
              s = s.replace(' | '+token, '').replace(token+' | ', '').replace(', '+token, '').replace(token+', ', '')
          # Remove direct/group/room references from the context value object one property per line.
          obsolete_props = ['activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText','activeInvestigateChatId','activeInvestigateReport','openDirectChat','openGroupChat','openRoomChat','openChatHub','openLockedChats']
          s = remove_lines_containing(s, [x+',' for x in obsolete_props])
          p.write_text(s)

          # Detail screens: messaging/contact actions are retired. Existing non-chat actions remain.
          detail_files = [
              'src/screens/ListingDetailScreen.js',
              'src/screens/PropertyDetailScreen.js',
              'src/screens/RoommateRequestDetailScreen.js',
              'src/screens/ServiceProviderDetailScreen.js',
          ]
          for fn in detail_files:
              p = ROOT/fn
              s = p.read_text()
              s = remove_lines_containing(s, [
                  "import { ensureDirectChat } from '../firebase/directChatService';",
                  "import * as directChatService from '../firebase/directChatService';",
              ])
              s = remove_named_assignment(s, 'chatSeller')
              s = remove_named_assignment(s, 'chatOwner')
              s = remove_named_assignment(s, 'contactPoster')
              s = remove_named_assignment(s, 'messageProvider')
              # Remove the retired chat/message/contact button blocks.
              lines = s.split('\n')
              out=[]; i=0
              while i < len(lines):
                  line=lines[i]
                  if 'onPress={chatSeller}' in line or 'onPress={chatOwner}' in line or 'onPress={contactPoster}' in line or 'onPress={messageProvider}' in line:
                      # Remove the enclosing TouchableOpacity block by brace counting from its opening line.
                      k=i
                      while k>=0 and '<TouchableOpacity' not in lines[k]: k-=1
                      if k>=0:
                          depth=0
                          q=k
                          while q < len(lines):
                              depth += lines[q].count('<TouchableOpacity')
                              depth -= lines[q].count('</TouchableOpacity>')
                              q += 1
                              if depth<=0: break
                          del lines[k:q]
                          i=k
                          continue
                  out.append(line); i+=1
              s='\n'.join(lines)
              s = s.replace('openDirectChat, ', '').replace(', openDirectChat', '').replace('profile, openDirectChat, ', 'profile, ')
              p.write_text(s)

          # Home screens: remove direct-chat message-customer helpers/imports. The order workflows remain intact.
          for fn in ['src/screens/DealerHomeScreen.js','src/screens/ResellerHomeScreen.js','src/screens/AdminHomeScreen.js']:
              p=ROOT/fn; s=p.read_text()
              s=remove_lines_containing(s,[
                  "import * as directChatService from '../firebase/directChatService';",
                  "import { ensureDirectChat } from '../firebase/directChatService';",
              ])
              s=remove_named_assignment(s,'messageCustomer')
              # Remove any standalone calls left behind if a handler was partially inlined.
              s='\n'.join(line for line in s.split('\n') if 'openDirectChat(' not in line and 'ensureDirectChat(' not in line and 'directChatService.' not in line)
              s=s.replace('openDirectChat, ', '').replace(', openDirectChat', '').replace('profile, openDirectChat, ', 'profile, ')
              p.write_text(s)

          # Marketplace search no longer needs the direct-chat callback/import.
          p=ROOT/'src/screens/MarketplaceSearchScreen.js'
          if p.exists():
              s=p.read_text()
              s=remove_lines_containing(s,["import * as directChatService from '../firebase/directChatService';"])
              s=s.replace('openDirectChat, ', '').replace(', openDirectChat', '')
              s='\n'.join(line for line in s.split('\n') if 'directChatService.' not in line and 'ensureDirectChat(' not in line)
              p.write_text(s)

      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.js src/screens .github/workflows/final-chat-cleanup.yml
          git diff --cached --quiet && exit 0
          git rm .github/workflows/final-chat-cleanup.yml
          git add -A
          git commit -m "chore: remove retired chat UI"
          git push
