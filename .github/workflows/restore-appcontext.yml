name: Restore AppContext

on:
  push:
    paths:
      - '.github/workflows/restore-appcontext.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore AppContext from known-good cleanup commit
        run: |
          git checkout 30c03bd9105973e6e7ae1fe3f4aef946be9a6eeb -- src/context/AppContext.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.js
          git commit -m "fix: restore AppContext after accidental overwrite [skip ci]"
          git push
