name: Final AppContext cleanup v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean AppContext
        shell: bash
        run: |
          set -euo pipefail
          git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > /tmp/AppContext.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/AppContext.js').read_text(encoding='utf-8')
          retired=['directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat','lockChatThread','unlockChatThread','joinDiscoverableRoom']
          s='\n'.join(line for line in s.splitlines() if not (line.lstrip().startswith('import ') and any(x in line for x in retired)))+'\n'
          for token in ['chatHub | ','directChatList | ','addContact | ','qrScan | ','myQrCode | ','groupList | ','newGroup | ','createRoom | ','roomSettings | ','investigateChat | ']: s=s.replace(token,'')
          def cut(text,start,end):
            a=text.find(start)
            if a<0: raise SystemExit('Missing: '+start)
            z=text.find(end,a)
            if z<0: raise SystemExit('Missing boundary: '+end)
            return text[:a]+text[z:],text[a:z]
          oa=s.find('  /** Opens the Support thread'); ob=s.find('  /** Opens a group chat thread',oa)
          if oa<0 or ob<0: raise SystemExit('Support openChat block not found')
          open_chat=s[oa:ob]
          ds='  // ---- direct chat (general-purpose 1:1 "Chat" tab, any two accounts) ----'
          s,direct=cut(s,ds,'  // ---- marketplace (Buy & Sell) ----')
          ringtone=[x for x in direct.splitlines() if 'activeRingtoneContactUid' in x or 'activeRingtoneContactName' in x]
          if len(ringtone)!=2: raise SystemExit('Ringtone state missing')
          support="  const [activeChatReturnTo, setActiveChatReturnTo] = useState('chatList');"
          s=s.replace(support,support+'\n\n  // ---- 1-to-1 call ringtone selection ----\n'+'\n'.join(ringtone)+'\n\n'+open_chat.rstrip(),1)
          s,_=cut(s,'  // ---- group chat ----','  // ---- Private vault unlock')
          s='\n'.join(x for x in s.splitlines() if 'incomingGroupCall' not in x)+'\n'
          marker='  // Same idea as the listener above, but for group calls'
          if marker in s: s,_=cut(s,marker,'  /** Starts a call with another user')
          if '  /** Starts a group call' in s: s,_=cut(s,'  /** Starts a group call','  // ---- Chat Lock helpers')
          if '  // ---- Chat Lock helpers' in s: s,_=cut(s,'  // ---- Chat Lock helpers','  /** Opens the Support thread')
          # Remove all retired live-list effects; keep the following private-vault AppState effect.
          effect_ranges=[
            ('  // ---- live direct-chat unread badge','  // ---- live list of groups'),
            ('  // ---- live list of groups','  // ---- live list of rooms'),
            ('  // ---- live list of rooms','  // ---- live list of public'),
            ('  // ---- live list of public','  // ---- live list of "kind:id" keys'),
            ('  // ---- live list of "kind:id" keys','  // Re-locks the Locked Chats vault'),
          ]
          for a,b in effect_ranges:
            if a in s: s,_=cut(s,a,b)
          # Remove retired notification branches, keeping Support/top-up/support-ticket/call handling.
          start=s.find('  useEffect(() => {\n    if (!authUser) return undefined;\n\n    const handleResponse = async (response) => {')
          if start>=0:
            end_marker='  }, [authUser, profile, openChat, openDirectChat, openGroupChat, openRoomChat, setAdminTab, setScreen]);'
            end=s.find(end_marker,start)
            if end>=0:
              block=s[start:end+len(end_marker)]
              a=block.find("        } else if (data.type === 'directChat'"); z=block.find("        } else if (data.type === 'topup'",a)
              if a>=0 and z>=0: block=block[:a]+block[z:]
              block=block.replace(end_marker,'  }, [authUser, profile, openChat, setAdminTab, setScreen]);')
              s=s[:start]+block+s[end+len(end_marker):]
          # Context value cleanup.
          vs=s.find('  const value = {'); ve=s.find('  };\n\n  return <AppContext.Provider',vs)
          if vs<0 or ve<0: raise SystemExit('Context value boundaries missing')
          value=s[vs:ve]
          if '    activeDirectChatId' in value:
            a=value.find('    activeDirectChatId'); z=value.find('    // marketplace',a)
            if z>=0: value=value[:a]+value[z:]
          if '    // group chat' in value:
            a=value.find('    // group chat'); z=value.find('    // private vault unlock',a)
            if z>=0: value=value[:a]+value[z:]
          s=s[:vs]+value+s[ve:]
          s=''.join(line for line in s.splitlines(True) if not any(x in line for x in retired))
          s=re.sub(r'^\s*,\s*\[\]\);\s*$', '', s, flags=re.M)
          required=['activeChatId','activeChatName','chatUnreadCount','activeChatReturnTo','openChat','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','startCall','answerIncomingCall','rejectIncomingCall','callService']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Required refs missing: '+', '.join(missing))
          bad=[x for x in retired if x in s]
          if bad: raise SystemExit('Retired refs remain: '+', '.join(bad))
          if len(s)<90000: raise SystemExit('Unexpectedly short AppContext: '+str(len(s)))
          Path('src/context/AppContext.js').write_text(s,encoding='utf-8')
          print('Clean AppContext written:',len(s),'bytes')
          PY
          npx --yes prettier@3 --write src/context/AppContext.js
          npx --yes prettier@3 --check src/context/AppContext.js
          git diff --check
      - name: Commit clean AppContext
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'refactor: clean retired chat architecture from AppContext'
          git push
