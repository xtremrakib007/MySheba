name: Codebase cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean retired chat code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_top_level_const(text, name):
              lines = text.splitlines(True)
              prefix = '  const ' + name
              start = next((i for i,l in enumerate(lines) if l.startswith(prefix) and (len(l)==len(prefix) or not (l[len(prefix)].isalnum() or l[len(prefix)] in '_$'))), None)
              if start is None: return text
              for i in range(start + 1, len(lines)):
                  if lines[i].strip() == '};':
                      return ''.join(lines[:start] + lines[i+1:])
              return text

          def remove_between(text, start_marker, end_marker):
              a = text.find(start_marker)
              if a < 0: return text
              b = text.find(end_marker, a + len(start_marker))
              if b < 0: return text
              return text[:a] + text[b:]

          retired_imports = ('directChatService','groupChatService','roomChatService')
          screen_handlers = {
              'ListingDetailScreen.js':['chatSeller'],
              'PropertyDetailScreen.js':['chatOwner'],
              'RoommateRequestDetailScreen.js':['contactPoster'],
              'ServiceProviderDetailScreen.js':['messageProvider'],
              'DealerHomeScreen.js':['messageCustomer'],
              'ResellerHomeScreen.js':['messageCustomer'],
              'AdminHomeScreen.js':['messageCustomer'],
              'MarketplaceSearchScreen.js':['startChat','messageUser','openUserChat'],
          }

          for root in [Path('src'), Path('admin-web/src')]:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.js','.jsx','.ts','.tsx'}: continue
                  s=p.read_text(encoding='utf-8'); original=s
                  s=''.join(line for line in s.splitlines(True) if not any('/firebase/'+x in line for x in retired_imports) and 'ensureDirectChat' not in line if line.lstrip().startswith('import')) if False else s
                  lines=s.splitlines(True)
                  lines=[line for line in lines if not (line.lstrip().startswith('import ') and any('/firebase/'+x in line for x in retired_imports)) and not (line.lstrip().startswith('import ') and 'ensureDirectChat' in line)]
                  s=''.join(lines)
                  for name in screen_handlers.get(p.name,[]): s=remove_top_level_const(s,name)
                  if s!=original: p.write_text(s,encoding='utf-8')

          p=Path('src/context/AppContext.js')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines(True)
          lines=[line for line in lines if not (line.lstrip().startswith('import ') and any('/firebase/'+x in line for x in retired_imports))]
          s=''.join(lines)

          s=remove_between(s,'  // ---- direct chat (general-purpose','  // ---- direct chat investigation')
          s=remove_between(s,'  // ---- group chat ----','  // ---- Private vault unlock')
          s=remove_between(s,'  // ---- live direct-chat unread badge','  // ---- live list of "kind:id"')
          s=remove_between(s,'  // Same idea as the listener above, but for group calls','  /** Starts a call with another user')
          s=remove_between(s,'  /** Starts a group call -','  const groupUnreadCount')
          s=remove_between(s,'  const groupUnreadCount','  /** Opens the Support thread')
          for name in ['openDirectChat','openGroupChat','openRoomChat','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','leaveGroupCall','cancelGroupCall','joinDiscoverableRoom','openChatHub','openLockedChats','lockChatThread','unlockChatThread','ensureChatUnlocked','isChatLocked']:
              s=remove_top_level_const(s,name)
          s=s.replace('    setActiveGroupId(null);\n','').replace('    setActiveDirectChatId(null);\n','').replace('    setActiveRoomId(null);\n','')
          # Remove legacy notification branches without regex-heavy parsing.
          for marker in ["        } else if (data.type === 'directChat'", "        } else if (data.type === 'groupChat'", "        } else if (data.type === 'roomChat'"]:
              while marker in s:
                  a=s.find(marker)
                  b=s.find("        } else if (data.type", a+len(marker))
                  if b < 0: b=s.find("        } else {", a+len(marker))
                  if b < 0: break
                  s=s[:a]+s[b:]
          # Remove stale context-value lines and obsolete comments, one line at a time.
          legacy_terms=('activeDirectChat','directChatUnread','activeGroupId','activeGroupName','myGroups','groupUnreadCount','activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab','incomingGroupCall','openDirectChat','openGroupChat','openRoomChat','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','directChats','groupChats','roomChats')
          s=''.join(line for line in s.splitlines(True) if not any(term in line for term in legacy_terms))
          p.write_text(s,encoding='utf-8')

          for rel in ['src/firebase/directChatService.js','src/firebase/groupChatService.js','src/firebase/roomChatService.js']:
              q=Path(rel)
              if q.exists(): q.unlink()
          PY

      - name: Verify retired chat dependencies are gone
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='GamePointsScreen.js' -E 'directChatService|groupChatService|roomChatService|ensureDirectChat|openDirectChat|openGroupChat|openRoomChat|startGroupCall|answerIncomingGroupCall|rejectIncomingGroupCall|leaveGroupCall|cancelGroupCall|activeDirectChat|activeGroupId|activeRoomId|myGroups|myRooms|discoverableRooms|groupUnreadCount|roomUnreadCount' src; then
            echo 'Retired chat dependencies remain.'
            exit 1
          fi

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/codebase-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish legacy chat cleanup'
          git push
