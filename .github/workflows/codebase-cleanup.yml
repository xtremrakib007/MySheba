name: Codebase cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete chat code safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_arrow(text, name):
              marker = re.search(r'(?m)^([ \t]*)const[ \t]+' + re.escape(name) + r'[ \t]*=', text)
              if not marker:
                  return text
              brace = text.find('{', marker.end())
              if brace < 0:
                  return text
              # Only operate when this looks like the function body, not an object literal.
              prefix = text[marker.end():brace]
              if '=>' not in prefix and 'useCallback' not in prefix:
                  return text
              depth = 0; quote = None; esc = False; line = False; block = False; i = brace
              while i < len(text):
                  c = text[i]; n = text[i+1] if i+1 < len(text) else ''
                  if line:
                      if c == '\n': line = False
                  elif block:
                      if c == '*' and n == '/': block = False; i += 1
                  elif quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                  else:
                      if c == '/' and n == '/': line = True; i += 1
                      elif c == '/' and n == '*': block = True; i += 1
                      elif c in "'\"`": quote = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              j = i + 1
                              while j < len(text) and text[j] in ' \t': j += 1
                              if j < len(text) and text[j] == ';': j += 1
                              if j < len(text) and text[j] == '\n': j += 1
                              return text[:marker.start()] + text[j:]
                  i += 1
              return text

          roots = [Path('src'), Path('admin-web/src')]
          service_imports = re.compile(r'(?m)^\s*import\s+\*\s+as\s+(?:directChatService|groupChatService|roomChatService)\s+from\s+[^;]+;\s*\n')
          ensure_import = re.compile(r'(?m)^\s*import\s*\{\s*ensureDirectChat\s*\}\s*from\s+[^;]+;\s*\n')

          targets = {
              'ListingDetailScreen.js': ['chatSeller'],
              'PropertyDetailScreen.js': ['chatOwner'],
              'RoommateRequestDetailScreen.js': ['contactPoster'],
              'ServiceProviderDetailScreen.js': ['messageProvider'],
              'DealerHomeScreen.js': ['messageCustomer'],
              'ResellerHomeScreen.js': ['messageCustomer'],
              'AdminHomeScreen.js': ['messageCustomer'],
              'MarketplaceSearchScreen.js': ['startChat', 'messageUser', 'openUserChat'],
          }

          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.js','.jsx','.ts','.tsx'}: continue
                  s = p.read_text(encoding='utf-8'); original = s
                  s = service_imports.sub('', s)
                  s = ensure_import.sub('', s)
                  for name in targets.get(p.name, []):
                      s = remove_arrow(s, name)
                  # Remove legacy message/contact buttons in the affected screens.
                  if p.name in targets:
                      s = re.sub(r'(?s)\s*<TouchableOpacity\b(?=[^>]*(?:messageBtn|messageBtnText|Message Seller|Chat Seller|Message))[^>]*>.*?</TouchableOpacity>\s*', '\n', s)
                  if s != original: p.write_text(s, encoding='utf-8')

          # AppContext is the main remaining legacy dependency. Remove imports,
          # state/subscriptions/handlers by exact named declarations, then remove
          # legacy routing/menu identifiers that are no longer valid.
          p = Path('src/context/AppContext.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = service_imports.sub('', s)
              for name in ['openDirectChat','openGroupChat','openRoomChat','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','leaveGroupCall','cancelGroupCall']:
                  s = remove_arrow(s, name)
              # Remove remaining direct/group/room subscription effects by their exact service calls.
              s = re.sub(r'(?s)\n\s*useEffect\(\(\) => \{\s*if \(!authUser\) \{\s*setDirectChatUnreadCount\(0\);\s*return undefined;\s*\}\s*const unsub = directChatService\.subscribeMyChats.*?\n\s*\}, \[authUser, profile, openChat, openDirectChat\]\);', '\n', s)
              s = re.sub(r'(?s)\n\s*useEffect\(\(\) => \{\s*if \(!authUser\) \{\s*setMyGroups\(\[\]\);\s*return undefined;\s*\}\s*const unsub = groupChatService\.subscribeMyGroups.*?\n\s*\}, \[authUser\]\);', '\n', s)
              s = re.sub(r'(?s)\n\s*useEffect\(\(\) => \{\s*if \(!authUser\) \{\s*setMyRooms\(\[\]\);\s*return undefined;\s*\}\s*const unsub = roomChatService\.subscribeMyRooms.*?\n\s*\}, \[authUser\]\);', '\n', s)
              s = re.sub(r'(?s)\n\s*useEffect\(\(\) => \{\s*if \(!authUser\) \{\s*setDiscoverableRooms\(\[\]\);\s*return undefined;\s*\}\s*const unsub = roomChatService\.subscribeDiscoverableRooms.*?\n\s*\}, \[authUser\]\);', '\n', s)
              # Remove obsolete route/menu names from the screen comment/list only; actual screens are handled by router cleanup later.
              s = s.replace(' | chat | chatList | chatHub | directChatList | addContact | qrScan | myQrCode | groupList | newGroup | createRoom | roomSettings', '')
              p.write_text(s, encoding='utf-8')

          # Delete obsolete client services. Support Chat remains in chatService.js.
          for rel in ['src/firebase/directChatService.js','src/firebase/groupChatService.js','src/firebase/roomChatService.js']:
              q = Path(rel)
              if q.exists(): q.unlink()
          PY

      - name: Verify retired chat code is gone from active app source
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='GamePointsScreen.js' -E 'directChatService|groupChatService|roomChatService|ensureDirectChat|openDirectChat|openGroupChat|openRoomChat|startGroupCall|answerIncomingGroupCall|rejectIncomingGroupCall|leaveGroupCall|cancelGroupCall' src; then
            echo 'Retired chat references remain.'
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude='*.md' -E 'directChats|groupChats|roomChats' src/screens src/context src/firebase; then
            echo 'Retired chat collection references remain in active app code.'
            exit 1
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/codebase-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete chat dependencies and workflow'
          git push
