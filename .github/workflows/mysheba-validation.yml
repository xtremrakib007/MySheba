name: MySheba validation

on:
  push:
    branches:
      - feature/all-role-home-grids-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysheba-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-config:
    name: Production configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate production configuration
        run: npm run production:check

  navigation-grid-audit:
    name: Navigation and role-grid audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit navigation and homepage grids
        run: npm run audit:nav

  cloud-functions-syntax:
    name: Cloud Functions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit Cloud Function JavaScript syntax
        run: npm run audit:functions

  unit-tests:
    name: API provider and authentication tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test API provider validation
        run: npm run test:api-provider
      - name: Test authentication/profile gate
        run: npm run test:auth

  source-audits:
    name: React context, JSX, and tile icon audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit React context usage
        run: npm run audit:context
      - name: Audit JSX escapes
        run: npm run audit:jsx
      - name: Audit tile icons
        run: npm run audit:icons

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Test Firestore security rules
        run: npx --yes firebase-tools emulators:exec --only firestore --project rules-test "npm run test:rules"

  android-js-export:
    name: Android JavaScript bundle export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --no-bytecode
