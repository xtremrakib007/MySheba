name: cleanup-retired-direct-chat
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dealer direct-chat UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/screens/DealerHomeScreen.js')
          s=p.read_text()
          s=s.replace("import * as directChatService from '../firebase/directChatService';\n", '')
          s=s.replace('    authUser, profile, openDirectChat,\n', '    authUser, profile,\n')
          s=s.replace('  const [receiptPinTx, setReceiptPinTx] = useState(null);\n  const [messagingId, setMessagingId] = useState(null);\n', '  const [receiptPinTx, setReceiptPinTx] = useState(null);\n')
          start=s.index('  const messageCustomer = async (tx) => {')
          end=s.index('\n\n  return (', start)
          s=s[:start]+s[end+2:]
          start=s.index('                <View style={styles.actions}>\n                  <TouchableOpacity\n                    style={styles.messageBtn}')
          end=s.index('                {tx.status === \'pending\' && (', start)
          s=s[:start]+s[end:]
          # Remove only now-unused declarations from this screen.
          s=s.replace('  const myRole = profile?.role;\n', '')
          s=s.replace('    messageBtn: {', '    /* messageBtn removed: retired Direct Chat */\n    messageBtn: {')
          # Remove the exact style block if present.
          import re
          s=re.sub(r'\n    /\* messageBtn removed: retired Direct Chat \*/\n    messageBtn: \{[^\n]*\},\n    messageBtnText: \{[^\n]*\},', '', s)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          test -z "$(grep -RIn --exclude-dir=.git --exclude-dir=node_modules "openDirectChat\|ensureDirectChat\|directChatService" src/screens/DealerHomeScreen.js || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/DealerHomeScreen.js
          git diff --cached --quiet || git commit -m "Clean retired direct chat from dealer panel"
          git push
      - name: Remove cleanup workflow
        run: |
          git rm .github/workflows/cleanup-direct-chat.yml
          git commit -m "Remove temporary direct chat cleanup workflow"
          git push
