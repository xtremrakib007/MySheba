name: Run verified AppContext cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good AppContext
        run: git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > /tmp/AppContext.js
      - name: Clean and verify AppContext
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/AppContext.js')
          s=p.read_text(encoding='utf-8')
          imports={
            "import * as directChatService from '../firebase/directChatService';",
            "import * as groupChatService from '../firebase/groupChatService';",
            "import * as roomChatService from '../firebase/roomChatService';",
            "import * as chatLockService from '../firebase/chatLockService';",
          }
          s='\n'.join(x for x in s.splitlines() if x.strip() not in imports)+'\n'
          for token in ['chatHub | ','directChatList | ','addContact | ','qrScan | ','myQrCode | ','groupList | ','newGroup | ','createRoom | ','roomSettings | ','investigateChat | ']: s=s.replace(token,'')
          states=['activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText','activeInvestigateChatId','activeInvestigateReport','lockedChatIds','chatVaultUnlocked','activeGroupId','activeGroupName','myGroups','groupUnreadCount','activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab','incomingGroupCall']
          s=''.join(x for x in s.splitlines(True) if not any(('const ['+n) in x for n in states))
          def remove_callback(t,n):
            marker='const '+n+' = useCallback'; a=t.find(marker)
            if a<0:return t
            a=t.rfind('  ',0,a); b=t.find('{',a); d=0;q=None;e=False
            for i in range(b,len(t)):
              c=t[i]
              if q:
                if e:e=False
                elif c=='\\':e=True
                elif c==q:q=None
                continue
              if c in "'\"`":q=c
              elif c=='{':d+=1
              elif c=='}':
                d-=1
                if d==0:
                  j=i+1
                  while j<len(t) and t[j] in ' ;\t\r\n':j+=1
                  return t[:a]+t[j:]
            raise SystemExit('unbalanced callback '+n)
          for n in ['openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','openInvestigateChat']:
            while 'const '+n+' = useCallback' in s:s=remove_callback(s,n)
          retired=['activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','openDirectChat','activeInvestigateChatId','activeInvestigateReport','openInvestigateChat','chatDraftText','activeGroupId','activeGroupName','myGroups','groupUnreadCount','openGroupChat','activeRoomId','activeRoomName','myRooms','discoverableRooms','openRoomChat','chatHubTab','openChatHub','incomingGroupCall','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','investigateChat']
          s=''.join(x for x in s.splitlines(True) if not any(n in x for n in retired))
          forbidden=['directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat']
          bad=[n for n in forbidden if n in s]
          if bad: raise SystemExit('retired refs remain: '+', '.join(bad))
          required=['activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService']
          missing=[n for n in required if n not in s]
          if missing: raise SystemExit('required refs missing: '+', '.join(missing))
          if len(s)<20000: raise SystemExit('unexpectedly short AppContext: '+str(len(s)))
          Path('src/context/AppContext.js').write_text(s,encoding='utf-8')
          print('AppContext verified:',len(s),'bytes')
          PY
          git diff --check
      - name: Commit verified AppContext
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'refactor: remove retired chat state from AppContext'
          git push
