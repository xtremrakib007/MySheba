name: Finalize AppContext cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove remaining malformed group-call block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/AppContext.js')
          s=p.read_text(encoding='utf-8')
          # Remove the incomplete group-call listener left by the first cleanup pass.
          a=s.find('  // Same idea as the listener above, but for group calls')
          if a>=0:
              z=s.find('  /** Starts a call with another user',a)
              if z<0: raise SystemExit('1-to-1 call boundary missing')
              s=s[:a]+s[z:]
          # Remove any remaining Chat Lock/private direct-chat legacy comment block.
          a=s.find('  // ---- live list of "kind:id" keys the signed-in user has locked')
          if a>=0:
              z=s.find('  // ---- Private vault unlock',a)
              if z>=0: s=s[:a]+s[z:]
          # Defensive cleanup of retired route names in the screen documentation.
          for token in ['chatHub | ','directChatList | ','addContact | ','qrScan | ','myQrCode | ','groupList | ','newGroup | ','createRoom | ','roomSettings | ','investigateChat | ']: s=s.replace(token,'')
          forbidden=['directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat','lockChatThread','unlockChatThread','joinDiscoverableRoom']
          # Remove only comment lines that still mention retired symbols; code references are fatal below.
          s=''.join(line for line in s.splitlines(True) if not (line.lstrip().startswith('//') and any(x in line for x in forbidden)))
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('retired AppContext refs remain: '+', '.join(bad))
          required=['activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService','startCall','answerIncomingCall','rejectIncomingCall']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('required Support/1-to-1 calling refs missing: '+', '.join(missing))
          if 'const [incomingGroupCall' in s: raise SystemExit('incomingGroupCall state remains')
          if len(s)<20000: raise SystemExit('unexpectedly short AppContext: '+str(len(s)))
          p.write_text(s,encoding='utf-8')
          print('final AppContext validation passed; bytes=',len(s))
          PY
          git diff --check
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'refactor: finalize AppContext chat cleanup'
          git push
