name: Fix reseller cleanup
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix reseller inquiry count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/screens/ResellerHomeScreen.js')
          s = p.read_text()
          old = "const newInquiriesCount = (resellerTxs.inquiries || []).filter((i) => (i.status || 'new') === 'new').length;"
          new = "const newInquiriesCount = inquiries.filter((i) => (i.status || 'new') === 'new').length;"
          if old not in s:
              raise SystemExit('expected stale line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/ResellerHomeScreen.js
          git commit -m 'Fix reseller inquiry count after chat cleanup' || exit 0
          git push
