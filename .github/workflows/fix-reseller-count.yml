name: Fix reseller cleanup
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore AppContext from known-good revision
        run: git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > /tmp/AppContext.js
      - name: Clean AppContext
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/AppContext.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'^import \* as (?:directChatService|groupChatService|roomChatService|chatLockService) from .*\n','',s,flags=re.M)
          for n in ('activeDirectChatId','activeDirectChatName','activeDirectChatUid','directChatUnreadCount','chatDraftText','activeInvestigateChatId','activeInvestigateReport','lockedChatIds','chatVaultUnlocked','activeGroupId','activeGroupName','myGroups','groupUnreadCount','activeRoomId','activeRoomName','myRooms','discoverableRooms','chatHubTab','incomingGroupCall'):
              s=re.sub(r'^  const \['+re.escape(n)+r'[^\n]*\n','',s,flags=re.M)
          def remove_callback(t,n):
              m=re.search(r'^  const '+re.escape(n)+r'\s*=\s*useCallback\b',t,re.M)
              if not m:return t
              ob=t.find('{',m.start());d=0;q=None;e=False
              for i in range(ob,len(t)):
                  c=t[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                  elif c in "'\"`":q=c
                  elif c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:
                          j=i+1
                          while j<len(t) and t[j] in ' ;\t\r\n':j+=1
                          return t[:m.start()]+t[j:]
              raise SystemExit('unbalanced callback '+n)
          for n in ('openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','answerIncomingGroupCall','rejectIncomingGroupCall','openInvestigateChat'):
              while re.search(r'^  const '+re.escape(n)+r'\s*=\s*useCallback\b',s,re.M):s=remove_callback(s,n)
          retired=re.compile(r'\b(activeDirectChatId|activeDirectChatName|activeDirectChatUid|directChatUnreadCount|openDirectChat|activeInvestigateChatId|activeInvestigateReport|openInvestigateChat|chatDraftText|activeGroupId|activeGroupName|myGroups|groupUnreadCount|openGroupChat|activeRoomId|activeRoomName|myRooms|discoverableRooms|openRoomChat|chatHubTab|openChatHub|incomingGroupCall|startGroupCall|answerIncomingGroupCall|rejectIncomingGroupCall|investigateChat)\b')
          s=''.join(line for line in s.splitlines(True) if not retired.search(line))
          for n in ('chatHub','directChatList','addContact','qrScan','myQrCode','groupList','newGroup','createRoom','roomSettings','investigateChat'):
              s=re.sub(r'\s*\|\s*'+re.escape(n)+r'(?=\s*\||\s*$)','',s,flags=re.M)
          forbidden=('directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat')
          if any(x in s for x in forbidden):raise SystemExit('retired AppContext references remain')
          required=('activeChatId','chatUnreadCount','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','callService')
          if any(x not in s for x in required):raise SystemExit('required Support/1-to-1 state missing')
          if len(s)<20000:raise SystemExit('AppContext unexpectedly short: '+str(len(s)))
          Path('src/context/AppContext.js').write_text(s,encoding='utf-8')
          print('validated AppContext length',len(s))
          PY
      - name: Commit AppContext cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git commit -m 'refactor: restore and clean AppContext'
          git push
