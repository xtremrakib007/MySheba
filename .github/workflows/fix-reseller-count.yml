name: Finalize AppContext cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild AppContext cleanly from known-good source
        shell: bash
        run: |
          set -euo pipefail
          git show c875464673f0e87ef84f66c7e198a394e80d266f:src/context/AppContext.js > /tmp/AppContext.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/AppContext.js')
          s=p.read_text(encoding='utf-8')
          imports=[
            "import * as directChatService from '../firebase/directChatService';",
            "import * as groupChatService from '../firebase/groupChatService';",
            "import * as roomChatService from '../firebase/roomChatService';",
            "import * as chatLockService from '../firebase/chatLockService';",
          ]
          s='\n'.join(line for line in s.splitlines() if line.strip() not in imports)+'\n'
          for token in ['chatHub | ','directChatList | ','addContact | ','qrScan | ','myQrCode | ','groupList | ','newGroup | ','createRoom | ','roomSettings | ','investigateChat | ']: s=s.replace(token,'')

          def cut(text,start,end):
              a=text.find(start)
              if a<0: raise SystemExit('Missing: '+start)
              z=text.find(end,a)
              if z<0: raise SystemExit('Missing boundary: '+end)
              return text[:a]+text[z:],text[a:z]

          # Extract the real Support openChat callback before deleting the old Chat Lock section.
          oa=s.find('  /** Opens the Support thread')
          if oa<0: raise SystemExit('Support openChat callback not found in known-good source')
          ob=s.find('  /** Opens a group chat thread',oa)
          if ob<0: raise SystemExit('Group chat callback boundary not found')
          open_chat=s[oa:ob]

          # Preserve ringtone state from the retired direct-chat section.
          ds='  // ---- direct chat (general-purpose 1:1 "Chat" tab, any two accounts) ----'
          s,direct_block=cut(s,ds,'  // ---- marketplace (Buy & Sell) ----')
          ringtone=[line for line in direct_block.splitlines() if 'const [activeRingtoneContactUid' in line or 'const [activeRingtoneContactName' in line]
          if len(ringtone)!=2: raise SystemExit('Ringtone state not found')
          support="  const [activeChatReturnTo, setActiveChatReturnTo] = useState('chatList');"
          insert=support+'\n\n  // ---- 1-to-1 call ringtone selection state ----\n'+'\n'.join(ringtone)+'\n\n'+open_chat.rstrip()
          s=s.replace(support,insert,1)

          # Remove group/room/chat-hub/chat-lock state and helpers, retaining private-vault state.
          s,_=cut(s,'  // ---- group chat ----','  // ---- Private vault unlock')

          # Remove incoming group-call state and listener.
          s='\n'.join(line for line in s.splitlines() if 'const [incomingGroupCall' not in line)+'\n'
          marker='  // Same idea as the listener above, but for group calls'
          if marker in s: s,_=cut(s,marker,'  /** Starts a call with another user')

          # Remove group-call callbacks and trailing group unread/chat-lock helpers.
          if '  /** Starts a group call' in s:
              s,_=cut(s,'  /** Starts a group call','  // ---- Chat Lock helpers')
          if '  // ---- Chat Lock helpers' in s:
              s,_=cut(s,'  // ---- Chat Lock helpers','  /** Opens the Support thread')

          # Notification routing: keep Support, top-up and support-ticket paths only.
          start=s.find('  useEffect(() => {\n    if (!authUser) return undefined;\n\n    const handleResponse = async (response) => {')
          if start>=0:
              end_marker='  }, [authUser, profile, openChat, openDirectChat, openGroupChat, openRoomChat, setAdminTab, setScreen]);'
              end=s.find(end_marker,start)
              if end<0: raise SystemExit('Notification effect end not found')
              block=s[start:end+len(end_marker)]
              a=block.find("        } else if (data.type === 'directChat'")
              z=block.find("        } else if (data.type === 'topup'",a)
              if a>=0 and z>=0: block=block[:a]+block[z:]
              block=block.replace(end_marker,'  }, [authUser, profile, openChat, setAdminTab, setScreen]);')
              s=s[:start]+block+s[end+len(end_marker):]

          # Context value cleanup.
          vs=s.find('  const value = {')
          ve=s.find('  };\n\n  return <AppContext.Provider',vs)
          if vs<0 or ve<0: raise SystemExit('Context value boundaries missing')
          value=s[vs:ve]
          if '    activeDirectChatId' in value:
              a=value.find('    activeDirectChatId'); z=value.find('    // marketplace',a)
              if z<0: raise SystemExit('Marketplace value boundary missing')
              value=value[:a]+value[z:]
          if '    // group chat' in value:
              a=value.find('    // group chat'); z=value.find('    // private vault unlock',a)
              if z<0: raise SystemExit('Private vault value boundary missing')
              value=value[:a]+value[z:]
          value=value.replace('    incomingGroupCall, startGroupCall, answerIncomingGroupCall, rejectIncomingGroupCall,\n','')
          s=s[:vs]+value+s[ve:]

          forbidden=['directChatService','groupChatService','roomChatService','chatLockService','openDirectChat','openGroupChat','openRoomChat','openChatHub','startGroupCall','subscribeIncomingGroupCalls','incomingGroupCall','activeDirectChat','activeGroupId','activeRoomId','myGroups','myRooms','chatHubTab','investigateChat','lockChatThread','unlockChatThread','joinDiscoverableRoom']
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('Retired AppContext refs remain: '+', '.join(bad))
          required=['activeChatId','activeChatName','chatUnreadCount','activeChatReturnTo','openChat','activeRingtoneContactUid','activeRingtoneContactName','activeCall','incomingCall','startCall','answerIncomingCall','rejectIncomingCall','callService']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Required Support/1-to-1 calling refs missing: '+', '.join(missing))
          if len(s)<100000: raise SystemExit('Unexpectedly short AppContext: '+str(len(s)))
          p.write_text(s,encoding='utf-8')
          print('Rebuilt AppContext bytes:',len(s))
          PY
          npx --yes prettier@3 --check src/context/AppContext.js
          git diff --check
      - name: Commit verified AppContext
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git diff --cached --check
          git commit -m 'refactor: clean AppContext retired chat architecture'
          git push
