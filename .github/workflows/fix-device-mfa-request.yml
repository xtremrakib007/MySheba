name: Fix new-device MFA request flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch device MFA request behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/deviceSessionService.js')
          s = p.read_text()
          old = """        } else {
          if (email && (data.resendEmailChallenge || !profile.pendingAdminEmailChallenge)) {
            await sendStaffEmailChallenge({ db, uid, email, deviceId, displayName: profile.name || profile.displayName });
          }
          await logAudit({ action: 'staff_mfa_challenge', targetUid: uid, performedBy: uid, performedByRole: profile.role, details: { deviceId, ip } });
          return { requiresOtp: true, reason: 'new_device', email, phone, availableMfaMethods: [phone && 'sms', email && 'email'].filter(Boolean), emailChallengeSent: Boolean(email) };
        }
"""
          new = """        } else {
          // Do not send an email automatically during password login.
          // The user must explicitly press \"Send Email Verification\" on
          // DeviceVerifyScreen. This prevents an OTP/link from being sent
          // before the user has requested it and keeps the UI/code state in sync.
          await logAudit({ action: 'staff_mfa_challenge_ready', targetUid: uid, performedBy: uid, performedByRole: profile.role, details: { deviceId, ip } });
          return { requiresOtp: true, reason: 'new_device', email, phone, availableMfaMethods: [phone && 'sms', email && 'email'].filter(Boolean), emailChallengeSent: false };
        }
"""
          if old not in s:
              raise SystemExit('Expected device MFA block not found; refusing to modify file.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/deviceSessionService.js
          git commit -m "Send new-device OTP only after user request"
          git rm .github/workflows/fix-device-mfa-request.yml
          git commit -m "Remove temporary MFA patch workflow"
          git push