name: Remove retired Game Points admin UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove Game Points UI/config
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/screens/AdminHomeScreen.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\nconst GIFT_LIMIT_FIELDS = \[.*?\];\n', '\n', s, flags=re.S)
          s = re.sub(r'\nconst RECHARGE_PRICING_FIELDS = \[.*?\];\n', "\nconst RECHARGE_PRICING_FIELDS = [\n  { key: 'rechargePointCostPerUnit', label: '📶 Mobile Recharge (× face value)' },\n  { key: 'internetPointCostPerUnit', label: '🌐 Internet Package (× face value)' },\n];\n", s, flags=re.S)
          s = re.sub(r'\nconst ROLE_PRICE_UNIT_OVERRIDES = \{[^\n]*gamePointsCostPerUnit[^\n]*\};', "\nconst ROLE_PRICE_UNIT_OVERRIDES = { rechargePointCostPerUnit: '×', internetPointCostPerUnit: '×' };", s)
          s = re.sub(r'\n\s*\{ key: [\'\"]gamePointsFeePercent[\'\"].*?\},', '', s)
          s = re.sub(r'\n\s*\{ key: [\'\"]gamePointsCostPerUnit[\'\"].*?\},', '', s)
          s = re.sub(r'\n// Next Update PRD §4 - Game Point Gifting.*?\nconst GIFT_LIMIT_FIELDS = \[.*?\];', '', s, flags=re.S)
          s = re.sub(r'\n\s*// Boolean, not numeric.*?\n\s*const toggleGiftEnabled = async \(\) => \{.*?\n\s*\};', '', s, flags=re.S)
          marker = 'Game Point Gifting'
          pos = s.find(marker)
          if pos >= 0:
              start = s.rfind('<View style={styles.card}>', 0, pos)
              if start >= 0:
                  depth = 0; i = start
                  while i < len(s):
                      op = s.find('<View', i); cl = s.find('</View>', i)
                      if cl < 0: break
                      if op >= 0 and op < cl:
                          depth += 1; i = op + 5
                      else:
                          depth -= 1; i = cl + 7
                          if depth == 0:
                              s = s[:start] + s[i:]; break
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          ! grep -Ein 'gamePoints|GamePoints|Game Point|GameBot|game bot' src/screens/AdminHomeScreen.js
      - name: Persist cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/AdminHomeScreen.js
          git commit -m 'chore: remove retired Game Points admin UI [skip ci]'
          git push origin HEAD:main
