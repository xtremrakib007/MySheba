name: Remove retired Game Points admin UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all retired Game Points references
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/screens/AdminHomeScreen.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\nconst GIFT_LIMIT_FIELDS\s*=\s*\[.*?\];\n','\n',s,flags=re.S)
          s=re.sub(r'\nconst PRICING_FIELDS\s*=\s*\[.*?\];',lambda m: re.sub(r'\n\s*\{[^\n]*(?:gamePoints|GameBot|Game Point)[^\n]*\},?','',m.group(0),flags=re.I),s,flags=re.S)
          s=re.sub(r'\nconst RECHARGE_PRICING_FIELDS\s*=\s*\[.*?\];',"\nconst RECHARGE_PRICING_FIELDS = [\n  { key: 'rechargePointCostPerUnit', label: '📶 Mobile Recharge (× face value)' },\n  { key: 'internetPointCostPerUnit', label: '🌐 Internet Package (× face value)' },\n];",s,flags=re.S)
          s=re.sub(r'\nconst ROLE_PRICE_UNIT_OVERRIDES\s*=\s*\{[^\n]*\};',"\nconst ROLE_PRICE_UNIT_OVERRIDES = { rechargePointCostPerUnit: '×', internetPointCostPerUnit: '×' };",s)
          s=re.sub(r'^.*(?:gamePoints|GamePoints|Game Point|GameBot|game bot).*$\n?','',s,flags=re.I|re.M)
          p.write_text(s,encoding='utf-8')
      - name: Verify and persist
        shell: bash
        run: |
          if grep -Ein 'gamePoints|GamePoints|Game Point|GameBot|game bot' src/screens/AdminHomeScreen.js; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/AdminHomeScreen.js
          git commit -m 'chore: remove retired Game Points admin UI [skip ci]' || true
          git push origin HEAD:main