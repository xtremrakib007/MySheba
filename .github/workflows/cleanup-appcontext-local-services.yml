name: Cleanup AppContext Local Services
on:
  push:
    paths:
      - '.github/workflows/cleanup-appcontext-local-services.yml'
      - '.github/workflows/cleanup-appcontext-local-services.trigger'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove retired Local Services context wiring
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/context/AppContext.js')
          s = p.read_text()
          old = '''  // ---- Buy & Sell / Local Services category lists - admin-editable from
  // Admin > Categories (see categoryService.js). Every screen with a
  // category picker or filter chips reads these live instead of the
  // hardcoded arrays that used to live in marketplaceService.js /
  // serviceProviderService.js. ----
  const [marketplaceCategories, setMarketplaceCategories] = useState(
    categoryService.DEFAULT_CATEGORIES.marketplace,
  );
  const [serviceCategories, setServiceCategories] = useState(
    categoryService.DEFAULT_CATEGORIES.services,
  );

'''
          if old not in s:
            raise SystemExit('Expected category state block not found')
          s = s.replace(old, '''  // ---- Admin-managed marketplace category list ----
  // Kept because the Admin Categories screen still owns marketplace category data.
  const [marketplaceCategories, setMarketplaceCategories] = useState(
    categoryService.DEFAULT_CATEGORIES.marketplace,
  );

''', 1)
          old = '''  useEffect(() => {
    if (!authUser) return undefined;
    const unsub = categoryService.subscribeCategories(
      "marketplace",
      setMarketplaceCategories,
      logListenerError("marketplaceCategories"),
    );
    return unsub;
  }, [authUser]);

  useEffect(() => {
    if (!authUser) return undefined;
    const unsub = categoryService.subscribeCategories(
      "services",
      setServiceCategories,
      logListenerError("serviceCategories"),
    );
    return unsub;
  }, [authUser]);

'''
          if old not in s:
            raise SystemExit('Expected category subscription block not found')
          s = s.replace(old, '''  useEffect(() => {
    if (!authUser) return undefined;
    const unsub = categoryService.subscribeCategories(
      "marketplace",
      setMarketplaceCategories,
      logListenerError("marketplaceCategories"),
    );
    return unsub;
  }, [authUser]);

''', 1)
          old = '''  // ---- Business Profile (PRD section 15 Monetization Plan - "Business
  // profile") ---- Screens call businessProfileService.js directly, so all
  // that lives here is which uid's business page to show - same "just the
  // navigation state" pattern as activeListingId/activePropertyId/
  // activeProviderId above. Opened either from a listing/property/
  // service's seller/owner/provider row (view someone else's), or from My
  // Account (view/edit your own).
'''
          new = '''  // ---- Business Profile ---- Screens call businessProfileService.js
  // directly; context only tracks which uid's business page to show.
  // Opened from My Account or another active business-profile entry point.
'''
          if old not in s:
            raise SystemExit('Expected stale Business Profile comment not found')
          s = s.replace(old, new, 1)
          s = re.sub(r'\n    // local services\n    activeProviderId,\n    openServiceProvidersHome,\n    openServiceProviderDetail,\n', '\n', s, count=1)
          s = s.replace('    serviceCategories,\n', '')
          p.write_text(s)
      - name: Verify
        run: |
          node --check src/context/AppContext.js
          ! grep -nE 'activeProviderId|setActiveProviderId|openServiceProvidersHome|openServiceProviderDetail|servicesCreateProvider|servicesMyServices|serviceProviderService|ServiceProvidersHome|CreateServiceScreen|MyServicesScreen|serviceCategories|setServiceCategories' src/context/AppContext.js App.js
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.js
          git rm -f .github/workflows/cleanup-appcontext-local-services.yml .github/workflows/cleanup-appcontext-local-services.trigger 2>/dev/null || true
          git commit -m 'refactor: remove retired local services context'
          git push
